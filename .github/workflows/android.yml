name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, for example v0.1.0. Leave empty to build only."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      VAPECONFIG_KEYSTORE_BASE64: ${{ secrets.VAPECONFIG_KEYSTORE_BASE64 }}
      VAPECONFIG_KEYSTORE_PASSWORD: ${{ secrets.VAPECONFIG_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare release signing key
        run: |
          test -n "$VAPECONFIG_KEYSTORE_BASE64"
          test -n "$VAPECONFIG_KEYSTORE_PASSWORD"
          printf '%s' "$VAPECONFIG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vapeconfig-release.p12"
          chmod 600 "$RUNNER_TEMP/vapeconfig-release.p12"
          echo "VAPECONFIG_KEYSTORE_PATH=$RUNNER_TEMP/vapeconfig-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease
      - name: Prepare APK asset
        run: cp app/build/outputs/apk/release/app-release.apk VapeConfig.apk

      - name: Compare APK signing certificate with latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          mkdir -p "$RUNNER_TEMP/latest-release"
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern VapeConfig.apk --dir "$RUNNER_TEMP/latest-release"; then
            previous_apk="$RUNNER_TEMP/latest-release/VapeConfig.apk"
          elif gh release download --repo "$GITHUB_REPOSITORY" --pattern VapeConfig-debug.apk --dir "$RUNNER_TEMP/latest-release"; then
            previous_apk="$RUNNER_TEMP/latest-release/VapeConfig-debug.apk"
          else
            previous_apk=""
          fi
          if [[ -n "$previous_apk" ]]; then
            current_info="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>&1)"
            previous_info="$("$apksigner" verify --print-certs "$previous_apk" 2>&1)"
            current_cert="$(printf '%s\n' "$current_info" | grep -F 'certificate SHA-256 digest:' | tail -n 1 | awk '{print $NF}')"
            previous_cert="$(printf '%s\n' "$previous_info" | grep -F 'certificate SHA-256 digest:' | tail -n 1 | awk '{print $NF}')"
            echo "Current APK certificate: $current_cert"
            echo "Latest release certificate: $previous_cert"
            if [[ -n "$current_cert" && "$current_cert" == "$previous_cert" ]]; then
              echo "Signing certificate matches; Android can update the existing installation."
            else
              echo "::warning::The first stable-key release cannot replace the previous APK. Future releases will match this key."
              printf '%s\n' "$current_info"
              printf '%s\n' "$previous_info"
            fi
          else
            echo "No previous release APK available for comparison."
          fi
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: VapeConfig-release
          path: VapeConfig.apk
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: VapeConfig-release
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must follow vMAJOR.MINOR.PATCH, for example v0.1.0"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists"
            exit 1
          fi
          gh release create "$RELEASE_VERSION" release-assets/VapeConfig.apk \
            --target main \
            --title "VapeConfig $RELEASE_VERSION" \
            --notes "VapeConfig $RELEASE_VERSION ajoute la sauvegarde et la restauration additive des fiches, recettes, coils et profils de batteries, le téléchargement intégré des APK, leur vérification d’intégrité et l’ouverture de l’installateur Android avec confirmation de l’utilisateur. L’APK est signé avec une clé stable pour permettre les mises à jour futures. Comme cette clé diffère de celle de v0.2.1, désinstallez v0.2.1 avant la première installation de cette release; les prochaines versions pourront se mettre à jour directement. Elle corrige aussi la recherche du catalogue (accents et synonymes), permet d’ouvrir les fiches au toucher et conserve un catalogue consultable hors ligne. Elle comprend le catalogue local et partagé, les batteries intégrées et amovibles, les recettes liquides, le configurateur de coils et l’estimation théorique de résistance pour fil simple. Les données personnelles restent sur l’appareil. La compatibilité compare uniquement les connecteurs saisis et ne valide ni les dimensions, ni l’électronique, ni la sécurité. Une estimation de résistance ne prouve pas qu’un montage est sûr : mesure et vérification indépendante indispensables."
