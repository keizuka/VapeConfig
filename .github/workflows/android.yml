name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, for example v0.1.0. Leave empty to build only."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk VapeConfig-debug.apk

      - name: Compare APK signing certificate with latest release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          mkdir -p "$RUNNER_TEMP/latest-release"
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern VapeConfig-debug.apk --dir "$RUNNER_TEMP/latest-release"; then
            current_info="$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk 2>&1)"
            previous_info="$("$apksigner" verify --print-certs "$RUNNER_TEMP/latest-release/VapeConfig-debug.apk" 2>&1)"
            current_cert="$(printf '%s\n' "$current_info" | grep -F 'certificate SHA-256 digest:' | tail -n 1 | awk '{print $NF}')"
            previous_cert="$(printf '%s\n' "$previous_info" | grep -F 'certificate SHA-256 digest:' | tail -n 1 | awk '{print $NF}')"
            echo "Current APK certificate: $current_cert"
            echo "Latest release certificate: $previous_cert"
            if [[ -n "$current_cert" && "$current_cert" == "$previous_cert" ]]; then
              echo "Signing certificate matches; Android can update the existing installation."
            else
              echo "::warning::Signing certificate differs from the latest release. Android will not install this APK over that installation."
              printf '%s\n' "$current_info"
              printf '%s\n' "$previous_info"
            fi
          else
            echo "No previous release APK available for comparison."
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VapeConfig-debug
          path: VapeConfig-debug.apk
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: VapeConfig-debug
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must follow vMAJOR.MINOR.PATCH, for example v0.1.0"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists"
            exit 1
          fi
          gh release create "$RELEASE_VERSION" release-assets/VapeConfig-debug.apk \
            --target main \
            --title "VapeConfig $RELEASE_VERSION" \
            --notes "VapeConfig $RELEASE_VERSION ajoute le téléchargement intégré des APK, leur vérification d’intégrité et l’ouverture de l’installateur Android avec confirmation de l’utilisateur. Elle corrige aussi la recherche du catalogue (accents et synonymes), permet d’ouvrir les fiches au toucher et conserve un catalogue consultable hors ligne. Elle comprend également les profils de batteries intégrées et amovibles, le catalogue local et partagé, le calculateur de mélange PG/VG/nicotine, et l’estimateur théorique de résistance pour fil simple. Les données personnelles restent sur l’appareil. La compatibilité compare uniquement les connecteurs saisis et ne valide ni les dimensions, ni l’électronique, ni la sécurité. Les estimations de résistance ne prouvent pas qu’un montage est sûr : mesure et vérification indépendante indispensables. Cette APK est une version debug non signée pour distribution de production ; Android peut afficher un avertissement à l’installation."
