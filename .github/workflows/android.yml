name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, for example v0.1.0. Leave empty to build only."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk VapeConfig-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VapeConfig-debug
          path: VapeConfig-debug.apk
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: VapeConfig-debug
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must follow vMAJOR.MINOR.PATCH, for example v0.1.0"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists"
            exit 1
          fi
          gh release create "$RELEASE_VERSION" release-assets/VapeConfig-debug.apk \
            --target main \
            --title "VapeConfig $RELEASE_VERSION" \
            --notes "Première préversion de VapeConfig. Cette APK debug est destinée aux essais. Le catalogue et plusieurs écrans restent des bases de travail. Le calcul reconstructible est une estimation et exige une vérification indépendante. Avant une diffusion de production, une signature dédiée et une validation complète seront nécessaires."
